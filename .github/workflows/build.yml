name: Build Releases

on:
  push:
    branches: [main, beta]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .

  # Every suite in tools/, on all three desktop platforms. Windows and
  # macOS runners have a display, so the GUI suites run for real there
  # (the macOS job is the only place the darwin code paths ever execute:
  # nobody on the project owns a Mac). Linux runs under xvfb. The runners
  # have no microphone; the tuner runs on TunerEngine.synthetic_hz.
  # Public repo: Actions minutes are free, so this runs on every push.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suites
        if: runner.os != 'Linux'
        run: python tools/run_tests.py
      - name: Run test suites (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/run_tests.py

  build:
    # Nothing is built or attached to a release unless lint and every
    # test job passed.
    needs: [lint, test]
    strategy:
      # One platform's build failing must not cancel the others': the
      # Mac tours and the frozen-build probes are evidence we want anyway.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Windows ships only the Inno Setup installer
            # (JustATuner-Windows-Setup-{version}.exe), uploaded by its
            # own dedicated step.
          - os: macos-latest
            artifact_name: JustATuner.app
            asset_name: JustATuner-macOS.zip
          - os: ubuntu-latest
            artifact_name: JustATuner
            asset_name: JustATuner-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        # libportaudio2: sounddevice runtime. libx11-dev: wgpu links -lX11
        # at build time, so the GPU renderer crate needs it to link.
        # xvfb: the frozen-build probe and the GPU suites need a display.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libx11-dev xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # GPU strobe tuner renderer (Rust/wgpu via pyo3 + maturin). Built on
      # Windows and Linux; build.py's capability check bundles it, and
      # tuner/view.py falls back to the canvas renderer at runtime if it's
      # somehow missing. Not built on macOS: Tk Aqua's winfo_id() is not
      # an NSView, so wgpu can't attach a surface there — Macs are
      # canvas-only by design (see tuner/view.py).
      - name: Install Rust toolchain
        if: matrix.os != 'macos-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Build GPU tuner renderer (Rust/wgpu)
        if: matrix.os != 'macos-latest'
        run: |
          pip install maturin
          python -m maturin build --release --manifest-path tuner_renderer/Cargo.toml
          pip install --find-links tuner_renderer/target/wheels tuner_render

      # The only place CI has the GPU wheel. Runners have a software
      # adapter (Windows: Basic Render Driver) or no Vulkan at all (Linux),
      # so this exercises the "software adapter / init failure -> canvas"
      # fallbacks for real; the GPU draw path itself only runs on a
      # machine with a GPU (Matt's).
      - name: Tuner suites with the GPU wheel
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tools/test_gpu_tuner.py
            xvfb-run -a python tools/test_tuner_canvas.py
          else
            python tools/test_gpu_tuner.py
            python tools/test_tuner_canvas.py
          fi

      - name: Build with PyInstaller
        run: python build.py

      # Frozen-build probe: launch what was just built with --selftest,
      # which builds both tabs headless, runs the tuner on a synthetic
      # tone and the drone tab, and exits 0/1. The one check that runs
      # the shipped bundle rather than the source tree (missing hidden
      # imports, a module bundled on the wrong platform). The .exe is a
      # windowed app, so PowerShell must wait on it explicitly.
      - name: Frozen-build probe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JUSTATUNER_CONFIG_DIR = "$env:RUNNER_TEMP\selftest-profile"
          $p = Start-Process -FilePath "dist\JustATuner.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          Get-Content "$env:JUSTATUNER_CONFIG_DIR\app.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Frozen-build probe (macOS)
        if: runner.os == 'macOS'
        run: |
          JUSTATUNER_CONFIG_DIR="$RUNNER_TEMP/selftest-profile" dist/JustATuner.app/Contents/MacOS/JustATuner --selftest
          cat "$RUNNER_TEMP/selftest-profile/app.log" || true

      - name: Frozen-build probe (Linux)
        if: runner.os == 'Linux'
        run: |
          JUSTATUNER_CONFIG_DIR="$RUNNER_TEMP/selftest-profile" xvfb-run -a dist/JustATuner --selftest
          cat "$RUNNER_TEMP/selftest-profile/app.log" || true

      # Eyes on the Mac: nobody on the project owns one. The built .app
      # walks every tab and dialog (`--tour all`), screenshots each, and
      # the pictures are uploaded, once in light mode and once dark. The
      # tuner runs on a synthetic tone (no microphone here). Never fails
      # the build — it's for a human to look at.
      - name: Screenshot tour of the running app (macOS, light + dark)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/tour-profile" "$RUNNER_TEMP/tour" "$RUNNER_TEMP/tour-dark"
          JUSTATUNER_CONFIG_DIR="$RUNNER_TEMP/tour-profile" dist/JustATuner.app/Contents/MacOS/JustATuner --tour all --shots "$RUNNER_TEMP/tour" &
          for i in $(seq 1 60); do
            [ -f "$RUNNER_TEMP/tour/tour-done.txt" ] && break
            sleep 3
          done
          pkill -f JustATuner || true
          cat "$RUNNER_TEMP/tour/tour-done.txt" || echo "tour did not finish"
          ls -la "$RUNNER_TEMP/tour"
          # Dark Mode. `defaults write` alone does not change the running
          # session (SSC's first dark tour came back light, 2026-10-06), so
          # also try the session-wide switch, and the app forces its own
          # windows dark with --appearance dark. tour-done.txt records each
          # shot's measured brightness: compare the dialog stops between
          # the two runs to see which took.
          defaults write -g AppleInterfaceStyle Dark
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' || echo "osascript dark mode refused"
          sleep 2
          JUSTATUNER_CONFIG_DIR="$RUNNER_TEMP/tour-profile" dist/JustATuner.app/Contents/MacOS/JustATuner --tour all --shots "$RUNNER_TEMP/tour-dark" --appearance dark &
          for i in $(seq 1 60); do
            [ -f "$RUNNER_TEMP/tour-dark/tour-done.txt" ] && break
            sleep 3
          done
          pkill -f JustATuner || true
          defaults delete -g AppleInterfaceStyle || true
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false' || true
          cat "$RUNNER_TEMP/tour-dark/tour-done.txt" || echo "dark tour did not finish"
          cat "$RUNNER_TEMP/tour-profile/app.log" || true

      - name: Upload macOS screenshot tours (light + dark)
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: mac-tour
          path: |
            ${{ runner.temp }}/tour/
            ${{ runner.temp }}/tour-dark/
          if-no-files-found: ignore

      - name: Verify mic permission and code signature (macOS)
        if: matrix.os == 'macos-latest'
        # The mic key alone is not enough: TCC silently denies (never
        # prompts) if the bundle's signature doesn't validate, which is
        # what happens when Info.plist is patched after signing without
        # re-signing. v1.1.0/v1.1.1 shipped that way.
        run: |
          plutil -extract NSMicrophoneUsageDescription raw \
            dist/JustATuner.app/Contents/Info.plist
          echo "NSMicrophoneUsageDescription present in bundle."
          codesign --verify --deep --strict dist/JustATuner.app
          echo "Code signature valid."

      # ---------- Windows installer (Inno Setup) ----------
      - name: Extract APP_VERSION from config.py
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $content = Get-Content config.py -Raw
          if ($content -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $ver = $Matches[1]
            "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "APP_VERSION=$ver"
          } else {
            Write-Error "Could not find APP_VERSION in config.py"
            exit 1
          }

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------- Rename / package per-platform artifacts ----------
      - name: Rename Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: mv dist/JustATuner dist/JustATuner-Linux

      - name: Package macOS app
        if: runner.os == 'macOS'
        # ditto, not `zip -r`: zip follows symlinks and stores them as
        # duplicate files, which breaks the code-signature resource seal
        # (PyInstaller bundles cross-link Frameworks/ and Resources/).
        # A broken seal means no TCC mic prompt for end users.
        run: |
          cd dist
          ditto -c -k --keepParent JustATuner.app ${{ matrix.asset_name }}

      - name: Verify signature survives zip round-trip (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -x -k dist/${{ matrix.asset_name }} "$RUNNER_TEMP/ziptest"
          codesign --verify --deep --strict "$RUNNER_TEMP/ziptest/JustATuner.app"
          echo "Signature valid after packaging round-trip."

      # ---------- Workflow-run artifacts ----------
      - name: Upload artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload Windows installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: JustATuner-Windows-Setup
          path: dist/JustATuner-Windows-Setup-*.exe

      # ---------- Attach to GitHub Release ----------
      - name: Upload to Release (Linux/macOS)
        if: matrix.os != 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer to Release
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JustATuner-Windows-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
